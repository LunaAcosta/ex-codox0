services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: finance-ai-api:week4
    container_name: finance-ai-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - APP_NAME=${APP_NAME:-Finance AI API}
      - APP_VERSION=${APP_VERSION:-1.0.0-rc.1}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - HOST=${HOST:-0.0.0.0}
      - PORT=${PORT:-8000}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:8081,http://127.0.0.1:8081}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-5.5}
      - OPENAI_MAX_OUTPUT_TOKENS=${OPENAI_MAX_OUTPUT_TOKENS:-220}
      - OPENAI_TIMEOUT_SECONDS=${OPENAI_TIMEOUT_SECONDS:-30}
      - OPENAI_MAX_RETRIES=${OPENAI_MAX_RETRIES:-1}
      - OPENAI_MAX_CONTEXT_CHARS=${OPENAI_MAX_CONTEXT_CHARS:-12000}
      - OPENAI_OCR_MODEL=${OPENAI_OCR_MODEL:-gpt-4.1-mini}
      - OCR_MAX_FILE_SIZE_MB=${OCR_MAX_FILE_SIZE_MB:-10}
    volumes:
      - .:/app
      - ./credentials/firebase-admin.json:/app/credentials/firebase-admin.json:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
