name: CI

on:
  push:
    branches:
      - main
      - master
      - "codex/**"

  pull_request:

  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile:
    name: Expo checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
      - run: npm run ci

  api:
    name: FastAPI tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Finance_AI_API

    env:
      APP_NAME: Finance AI API
      APP_VERSION: 1.0.0
      ENVIRONMENT: test
      HOST: 127.0.0.1
      PORT: 8000
      CORS_ORIGINS: http://localhost:8081
      OPENAI_API_KEY: test-placeholder-not-a-real-key
      OPENAI_MODEL: test-model
      OPENAI_OCR_MODEL: test-model

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Finance_AI_API/requirements.txt

      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q app